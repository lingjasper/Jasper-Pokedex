name: Beta v0.10.2 wire fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add v0.10.2 fix script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          tag = '<script src="beta0102-fixes.js?v=0.10.2"></script>'
          if tag not in text:
              text = text.replace('</body>', f'  {tag}\n</body>')
              path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Beta v0.10.2 — wire search and jump fixes"
          git push
          git rm .github/workflows/beta0102-wire-fixes.yml
          git commit -m "Beta v0.10.2 — remove one-shot fix workflow"
          git push
