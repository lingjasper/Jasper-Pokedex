name: Enable GitHub Sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject sync script into index.html
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script src="github-sync.js"></script>'

          if marker in text:
              print('GitHub sync script already enabled.')
          else:
              if '</body>' not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace('</body>', f'{marker}\n</body>', 1)
              path.write_text(text, encoding='utf-8')
              print('Injected GitHub sync script.')
          PY

      - name: Commit injection
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Enable GitHub save sync"
          git push
