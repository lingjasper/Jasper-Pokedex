name: Beta v0.10 wire data renderer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire-renderer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Wire Beta v0.10 renderer into the page
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          script = '<script src="pokedex-engine.js?v=0.10"></script>'
          if script not in text:
              text = text.replace('</body>', f'  {script}\n</body>')
              path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Beta v0.10 — wire data-driven Pokedex renderer"
          git push
          git rm .github/workflows/beta010-wire-renderer.yml
          git commit -m "Beta v0.10 — remove one-shot wiring workflow"
          git push
