name: v1.0.1 Foundation Regression

on:
  push:
    branches: ["v1.0.1-multigame-foundation"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check runtime modules
        run: |
          node --check pokedex-engine.js
          node --check github-sync.js
          node --check beta071-base.js
          node --check beta1353-bugfix.js

      - name: Run v1.0.1 foundation regression
        run: node tests/v101-foundation-regression.mjs
