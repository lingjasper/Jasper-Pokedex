name: Beta v0.10.1.2 finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make version.js authoritative and refresh after sync
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # Ensure version.js is loaded before application scripts.
          index = root / 'index.html'
          text = index.read_text()
          tag = '<script src="version.js?v=0.10.1.2"></script>'
          if 'src="version.js' not in text:
              m = re.search(r'<script\b', text, re.I)
              if m:
                  text = text[:m.start()] + tag + '\n' + text[m.start():]
              else:
                  text = text.replace('</body>', f'  {tag}\n</body>')
          index.write_text(text)

          # Remove every literal release moniker outside version.js.
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == Path('version.js'):
                  continue
              if path.suffix.lower() not in {'.js', '.html', '.css'}:
                  continue
              s = path.read_text()
              s = re.sub(r'Beta v\d+(?:\.\d+){2,3}', 'release moniker', s)
              path.write_text(s)

          # Point the active renderers at the one source of truth.
          for name in ('pokedex-engine.js', 'beta071.js', 'beta071-base.js'):
              p = root / name
              if not p.exists():
                  continue
              s = p.read_text()
              s = re.sub(r"const RELEASE\s*=\s*'release moniker';", "const RELEASE = window.JASPER_POKEDEX_VERSION;", s)
              s = re.sub(r"const BETA_LABEL\s*=\s*'release moniker';", "const BETA_LABEL = window.JASPER_POKEDEX_VERSION;", s)
              s = s.replace("const BASE = 'beta071-base.js?v=0.9.7';", "const BASE = 'beta071-base.js';")
              s = s.replace("const BASE = 'beta071-base.js?v=release moniker';", "const BASE = 'beta071-base.js';")
              p.write_text(s)

          # The v0.10 renderer owns the visible moniker. Legacy layers only read it.
          engine = root / 'pokedex-engine.js'
          if engine.exists():
              s = engine.read_text()
              s = s.replace("const RELEASE = window.JASPER_POKEDEX_VERSION;", "const RELEASE = window.JASPER_POKEDEX_VERSION;")
              # Re-render when GitHub sync replaces local progress; no page refresh required.
              marker = "window.JASPER_POKEDEX = { game, pokemon, boxColumns: BOX_COLUMNS, boxRows: BOX_ROWS, boxSize: BOX_SIZE };"
              if 'window.JASPER_POKEDEX_REFRESH' not in s:
                  s = s.replace(marker, marker + "\n    window.JASPER_POKEDEX_REFRESH = () => renderGame(window.JASPER_ACTIVE_GAME || game);")
              boot_marker = "if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });"
              listener = "\n  window.addEventListener('jasper:pokedex-state-synced', () => { if (window.JASPER_POKEDEX_REFRESH) window.JASPER_POKEDEX_REFRESH().catch(console.error); });\n"
              if 'jasper:pokedex-state-synced' not in s:
                  s = s.replace(boot_marker, listener + boot_marker)
              engine.write_text(s)

          sync = root / 'github-sync.js'
          if sync.exists():
              s = sync.read_text()
              # Replace the forced reload-after-sync behavior with an in-place renderer refresh.
              old = re.compile(r"\s*if\(sessionStorage\.getItem\(RELOAD_KEY\)!==remote\.sha\)\{.*?\}\s*else sessionStorage\.removeItem\(RELOAD_KEY\);", re.S)
              s, n = old.subn("\n      window.dispatchEvent(new CustomEvent('jasper:pokedex-state-synced', { detail: { sha: remote.sha } }));", s, count=1)
              if n == 0:
                  # Fallback for formatting variants: remove the reload condition by its distinctive keys.
                  s = s.replace("sessionStorage.getItem(RELOAD_KEY)!==remote.sha", "false")
              sync.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Beta v0.10.1.2 — single moniker source and instant sync refresh"
          git push
          git rm .github/workflows/v01012-finalize.yml
          git commit -m "Beta v0.10.1.2 — remove one-shot finalize workflow"
          git push
