name: Beta v0.10.1.1 full restoration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore v0.10.1 runtime files
        run: |
          git checkout 5cad083247ef8bf43e23088b416b8898d10e712c -- index.html github-sync.js beta071.js beta071-base.js pokedex-engine.js beta0102-fixes.js stabilization-v094.js
          rm -f beta0103-fixes.js beta0104-fixes.js beta0105-fixes.js beta0106-fixes.js beta0107-fixes.js
          python - <<'PY'
          from pathlib import Path
          p = Path('pokedex-engine.js')
          s = p.read_text()
          s = s.replace("const RELEASE = 'Beta v0.10.1';", "const RELEASE = 'Beta v0.10.1.1';")
          p.write_text(s)
          p = Path('beta071.js')
          s = p.read_text()
          s = s.replace('Beta v0.9.7', 'Beta v0.10.1.1')
          s = s.replace('v=0.9.7', 'v=0.10.1.1')
          p.write_text(s)
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('beta071.js?v=0.9.7', 'beta071.js?v=0.10.1.1')
          s = s.replace('Beta v0.9.7', 'Beta v0.10.1.1')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Beta v0.10.1.1 — full restoration to v0.10.1" || exit 0
          git push
          git rm .github/workflows/restore-v0101.yml
          git commit -m "Beta v0.10.1.1 — remove restoration workflow"
          git push
