name: Stage 1 Refactor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Split inline CSS and JavaScript
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p css js

          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          style = re.search(r'<style>(.*?)</style>', html, re.S)
          script = re.search(r'<script>(.*?)</script>', html, re.S)

          if not style or not script:
              raise SystemExit('Expected inline <style> and <script> blocks were not found.')

          Path('css/style.css').write_text(style.group(1).strip() + '\n', encoding='utf-8')
          Path('js/app.js').write_text(script.group(1).strip() + '\n', encoding='utf-8')

          html = html[:style.start()] + '<link rel="stylesheet" href="css/style.css">' + html[style.end():]
          html = html[:script.start()] + '<script src="js/app.js" defer></script>' + html[script.end():]
          index.write_text(html, encoding='utf-8')
          PY

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html css/style.css js/app.js .github/workflows/stage1-refactor.yml
          git commit -m 'Refactor frontend structure [skip ci]'
          git push
