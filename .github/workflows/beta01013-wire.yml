name: Beta v0.10.1.3 wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Wire v0.10.1.3 fixes after the sync and renderer scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          tag = '<script src="beta01013-fixes.js?v=0.10.1.3"></script>'
          if tag not in s:
              marker = '<script src="pokedex-engine.js?v=0.10"></script>'
              if marker in s:
                  s = s.replace(marker, marker + '\n' + tag)
              else:
                  s = s.replace('</body>', tag + '\n</body>')
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Beta v0.10.1.3 — wire stability fixes"
          git push
          git rm .github/workflows/beta01013-wire.yml
          git commit -m "Beta v0.10.1.3 — remove temporary wiring workflow"
          git push
