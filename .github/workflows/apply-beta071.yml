name: Apply Beta v0.7.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-beta071:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Beta v0.7.1 script to index
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="beta071.js"></script>'

          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace(marker, f'{tag}\n{marker}', 1)
              path.write_text(text, encoding='utf-8')
              print('Injected beta071.js into index.html')
          else:
              print('beta071.js is already referenced; no index change needed')
          PY

      - name: Commit Beta v0.7.1 and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-beta071.yml
          git commit -m "Beta v0.7.1" -m "- Updated the webpage moniker from Beta v0.5 to Beta v0.7.1.\n- On mobile, Box and List buttons now have a minimum width of 80px while retaining their icons.\n- Made the mobile search dropdown span the full page width.\n- Added dynamic box completion counters in the top-right corner of every storage box.\n- Increased the fixed header banner top and bottom padding to 24px."
          git push origin main
