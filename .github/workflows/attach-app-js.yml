name: Attach app script

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  attach:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add app.js to index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="js/app.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('Could not find </body> in index.html')
              text = text.replace(marker, f'  {tag}\n{marker}', 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Load app.js for checkbox persistence'
          git push

      - name: Remove one-time workflow
        run: |
          rm .github/workflows/attach-app-js.yml
          git add .github/workflows/attach-app-js.yml
          git commit -m 'Remove one-time app script attachment workflow'
          git push
